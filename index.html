<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>实用小工具</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #b8860b;
    --accent-hover: #9c7209;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    padding:
      calc(20px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(20px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0; font-size: 13px; }

  .group-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    color: var(--muted);
    text-transform: uppercase;
    margin: 22px 4px 10px;
  }

  ul.list { list-style: none; margin: 0; padding: 0; }
  ul.list li { margin-bottom: 10px; }

  a.item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: border-color .15s, transform .1s, box-shadow .15s;
  }
  a.item:active {
    transform: scale(.99);
    border-color: var(--accent);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
  }
  @media (hover: hover) {
    a.item:hover { border-color: var(--accent); }
  }

  .icon {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    background: #fbf6e9;
  }
  .info { flex: 1 1 auto; min-width: 0; }
  .info .title {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info .desc {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chev {
    flex: 0 0 auto;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>实用小工具</h1>
      <p class="sub">常用计算与换算工具集合</p>
    </header>

    <div class="group-title">黄金换算</div>
    <ul class="list">
      <li>
        <a class="item" href="au-calculate/gold-au999-calculator-mobile.html">
          <span class="icon">🥇</span>
          <span class="info">
            <span class="title">AU999 金价换算表（移动版）</span>
            <span class="desc">国际金价 → 国内金价，适配手机屏幕</span>
          </span>
          <span class="chev">›</span>
        </a>
      </li>
      <li>
        <a class="item" href="au-calculate/gold-au999-calculator.html">
          <span class="icon">📊</span>
          <span class="info">
            <span class="title">AU999 金价换算表</span>
            <span class="desc">国际金价 → 国内金价，电脑端布局</span>
          </span>
          <span class="chev">›</span>
        </a>
      </li>
    </ul>

    <footer>点击卡片即可打开对应工具</footer>
  </div>
</body>
</html>
